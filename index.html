</style></head><body><header><div class="wrap top"><a class="brand" href="#home"><b aria-hidden="true">♠</b>홀덤 스터디룸</a><span class="minor">함께 배우고, 이유를 이해하기</span><a class="ghost" href="#friends">우리 모임 설정</a></div><nav class="wrap nav" aria-label="주 메뉴"><a href="#home">홈</a><a href="#basics">처음 배우기</a><a href="#hands">족보표</a><a href="#odds">콜 가격</a><a href="#glossary">용어 사전</a><a href="#practice">판단 연습</a><a href="#learn">외부 자료</a><a href="#research">평가 근거</a></nav></header><main class="wrap" id="view"></main><div class="wrap" id="guideWrap" hidden><section class="panel guide-short" id="guide"><h2>처음이라면, 세 가지만 보세요.</h2><p>① 카드 2장을 받습니다. ② 공개 카드와 함께 좋은 5장을 만듭니다. ③ 계속할 때 새로 내야 하는 돈을 확인합니다.</p><div class="reference-links"><a href="#basics">그림으로 첫 판 배우기 →</a><a href="#odds">콜 가격 쉽게 이해하기 →</a><a href="#glossary">모르는 말 찾아보기 →</a></div><p class="fine">자세한 기준표와 계산 가정은 <a href="#research">평가 근거 페이지</a>에서 필요한 부분만 펼쳐 읽을 수 있어요.</p></section></div><footer><div class="wrap">홀덤 스터디룸 · v3 / 코인으로 배우는 교육용 사이트</div></footer><script>
'use strict';
const POS=['UTG','HJ','CO','BTN','SB','BB'];
const SUITS={s:['♠','스페이드'],h:['♥','하트'],d:['♦','다이아몬드'],c:['♣','클로버']};
const NAMES={A:'에이스',K:'킹',Q:'퀸',J:'잭',T:'10'};
const ACTIONS={fold:'폴드',call:'콜',raise:'레이즈'};
const LABELS={good:'좋은 선택',maybe:'상황에 따라 가능',risk:'초보자에게 위험한 선택'};
const POINTS={good:2,maybe:1,risk:0};
const CATEGORIES={pre:'프리플랍 판단',position:'자리 이해',draw:'드로우 판단',odds:'팟 오즈 판단'};
// 고정 교육 데이터. good=기준에 가까운 선택, maybe=조건을 붙여 허용하는 대안.
// 런타임은 카드/평가를 무작위 생성하지 않으며 출제 순서만 Fisher–Yates로 섞는다.
function pre(id,title,pos,hole,history,pot,call,best,alternatives,hand,reason,criteria,raiseTo,notes={}){
 return {id,mode:'pre',title,pos,hole:hole.split(' '),board:[],history,pot,call,bet:0,raiseTo,actions:['raise','call','fold'],best,alternatives,hand,reason,criteria,tags:['pre','position',...(notes.odds?['odds']:[])],assumption:notes.assumption||'뒤에 남은 사람은 아직 행동하지 않았습니다. 특별한 상대 정보가 없으며, 먼저 입장할 때는 레이즈 중심으로 연습합니다.',actionFeedback:notes.feedback||{}};
}
function opened(pos){const prior=POS.slice(0,POS.indexOf(pos));return prior.length?[prior.join(' · ')+' 모두 폴드']:['UTG인 내가 첫 번째로 행동'];}
function flop(id,title,pos,hole,board,base,bet,best,alternatives,hand,reason,criteria,draw=null,notes={}){
 return {id,mode:'flop',title,pos,hole:hole.split(' '),board:board.split(' '),history:[notes.history||'프리플랍: 내가 3BB 레이즈, 상대가 콜. 나머지는 폴드.',`플랍: ${pos==='BB'?'내가 체크 → 상대가':'상대가 먼저'} ${bet}BB 베팅 (${fmt(base)}BB 팟 기준).`],pot:base+bet,base,bet,call:bet,raiseTo:bet*3,actions:['fold','call','raise'],best,alternatives,hand,reason,criteria,draw,tags:[...(draw?['draw']:[]),'odds'],assumption:notes.assumption||'헤즈업(두 명). 상대는 보통의 참가자이며, 나는 이번 플랍에 아직 칩을 내지 않았습니다. 이후 스트리트에 추가 베팅이 나올 수 있습니다.',actionFeedback:notes.feedback||{}};
}
const QUESTIONS=[
pre('P01','첫 자리에서의 출발','UTG','As Kd',opened('UTG'),1.5,1,'raise',[],'에이스와 킹, 다른 무늬입니다. 아직 공개 카드가 없어 완성 족보가 아닌 시작 패의 힘을 봅니다.','강한 높은 카드 두 장은 앞자리에서도 시작할 만합니다. 레이즈하면 약한 패의 쉬운 입장을 줄이고 팟을 주도할 수 있습니다. 콜로 림프하기보다 총 2.5BB 레이즈를 연습하세요.','앞자리의 강한 높은 카드 → 레이즈 중심',2.5),

function fmt(n){return Number.isInteger(n)?String(n):String(Number(n.toFixed(2)));}
function pct(n){return (n*100).toFixed(1)+'%';}
// pot은 상대 베팅을 포함한 콜 직전 금액. 콜 비용 0은 0%를 반환하되 출제하지 않는다.
function requiredEquity(pot,call){if(!Number.isFinite(pot)||!Number.isFinite(call)||pot<=0||call<0)throw Error('팟/콜 금액 오류');return call/(pot+call);}
// 상대 카드와 번카드는 미지 카드 집합에 포함. 보이는 카드만 제외하며 승리 아웃을 보장하지 않는다.
function outCards(q){if(!q.draw)return [];const known=new Set([...q.hole,...q.board]);return '23456789TJQKA'.split('').flatMap(r=>Object.keys(SUITS).map(s=>r+s)).filter(c=>!known.has(c)&&((q.draw.ranks||[]).includes(c[0])||c[1]===q.draw.suit));}
function drawProbability(outs,unseen=47,cards=1){if(!Number.isInteger(outs)||outs<0||outs>unseen||![1,2].includes(cards)||unseen<2)throw Error('아웃 계산 오류');return cards===1?outs/unseen:1-(unseen-outs)/unseen*(unseen-outs-1)/(unseen-1);}
function assessment(q,action){if(!q.actions.includes(action))throw Error('불가능한 행동');return action===q.best?'good':q.alternatives.includes(action)?'maybe':'risk';}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function aggregate(records){return Object.keys(CATEGORIES).map(tag=>{const rows=records.filter(r=>r.q.tags.includes(tag));return {tag,count:rows.length,score:rows.reduce((a,r)=>a+POINTS[r.grade],0),max:rows.length*2};});}
function validateQuestions(data){const ids=new Set();for(const q of data){if(ids.has(q.id))throw Error('문제 ID 중복');ids.add(q.id);const cards=[...q.hole,...q.board];if(cards.some(c=>!/^[2-9TJQKA][shdc]$/.test(c))||new Set(cards).size!==cards.length||q.hole.length!==2||q.board.length!==(q.mode==='pre'?0:3))throw Error(q.id+' 카드 오류');if(!POS.includes(q.pos)||q.call<=0||q.call>q.pot||q.pot>200||!q.actions.includes(q.best)||q.alternatives.some(a=>!q.actions.includes(a)||a===q.best))throw Error(q.id+' 상황 오류');requiredEquity(q.pot,q.call);if(q.mode==='flop'&&(q.pot!==q.base+q.bet||q.call!==q.bet||q.raiseTo<q.bet*2))throw Error(q.id+' 베팅 오류');if(q.draw&&!outCards(q).length)throw Error(q.id+' 아웃 오류');if(!q.hand||!q.reason||!q.criteria)throw Error(q.id+' 해설 누락');}return true;}
validateQuestions(QUESTIONS);

function coinText(text,q){return text.replace(/([0-9]+(?:\.[0-9]+)?)BB/g,(_,n)=>money(q,Number(n)));}
function chipBreakdown(amount){if(!Number.isInteger(amount)||amount<0||amount%100)throw Error('100코인 단위의 정수 금액만 표시');let left=amount;return COINS.flatMap(c=>{const count=Math.floor(left/c);left%=c;return count?[{coin:c,count}]:[];});}
function chipText(amount){return chipBreakdown(amount).map(c=>`${c.coin.toLocaleString('ko-KR')} × ${c.count}`).join(' + ')||'없음';}
function positionName(q){return q.rule==='house'?HOUSE_NAMES[q.pos]:q.pos;}
function cardHtml(c){const [symbol,name]=SUITS[c[1]],rank=c[0]==='T'?'10':c[0];return `<span class="card ${'hd'.includes(c[1])?'red':''}" role="img" aria-label="${name} ${NAMES[c[0]]||c[0]}" title="${name} ${NAMES[c[0]]||c[0]}"><span class="corner" aria-hidden="true">${rank}${symbol}</span><span class="rank" aria-hidden="true">${rank}</span><span class="suit" aria-hidden="true">${symbol}</span></span>`;}

function scenarioKey(q){return JSON.stringify([q.rule,q.rule==='house'?q.ante:0,q.mode,q.pos,[...q.hole].sort(),[...q.board].sort(),q.pot,q.call,q.best]);}
function questionPool(){const unique=new Map();for(const seed of SEEDS)for(let i=0;i<SUIT_PERMUTATIONS.length;i++){const q=adaptRules(suitVariant(seed,SUIT_PERMUTATIONS[i]));q.id=`${seed.id}-${q.rule}-${i}`;q.key=scenarioKey(q);if(!unique.has(q.key))unique.set(q.key,q);}return [...unique.values()];}
function validateQuestions(data){const ids=new Set();for(const q of data){if(ids.has(q.id))throw Error('문제 ID 중복');ids.add(q.id);const cards=[...q.hole,...q.board];if(cards.some(c=>!/^[2-9TJQKA][shdc]$/.test(c))||new Set(cards).size!==cards.length||q.hole.length!==2||q.board.length!==(q.mode==='pre'?0:3))throw Error(q.id+' 카드 오류');requiredEquity(q.pot,q.call);if(!POS.includes(q.pos)||q.call>q.pot||q.pot>200||q.call<0||!q.actions.includes(q.best)||q.alternatives.some(a=>!q.actions.includes(a)||a===q.best))throw Error(q.id+' 상황 오류');if(q.call===0&&!q.actions.includes('check'))throw Error(q.id+' 무료 체크 누락');if(q.mode==='flop'&&(q.pot!==q.base+q.bet||q.call!==q.bet||q.raiseTo<q.bet*2))throw Error(q.id+' 베팅 오류');if(q.draw&&!outCards(q).length)throw Error(q.id+' 아웃 오류');if(!q.hand||!q.reason||!q.criteria)throw Error(q.id+' 해설 누락');if(q.coinUnit)for(const amount of [q.pot,q.call,q.raiseTo])chipBreakdown(Math.round(amount*q.coinUnit));}return true;}
function pickQuestions(pool,count){const available=shuffle(pool.filter(q=>!seen.has(q.key)));const picked=[],families=new Set();for(const q of available){if(!families.has(q.sourceId)){picked.push(q);families.add(q.sourceId);}if(picked.length===count)break;}for(const q of available){if(picked.length===count)break;if(!picked.includes(q))picked.push(q);}return picked;}
function newSession(){const pool=questionPool();validateQuestions(pool);const prePool=pool.filter(q=>q.mode==='pre'),flopPool=pool.filter(q=>q.mode==='flop');const questions=mode==='mixed'?shuffle([...pickQuestions(prePool,5),...pickQuestions(flopPool,5)]):pickQuestions(mode==='pre'?prePool:flopPool,10);if(questions.length!==10){toast('이번 설정의 새 문제를 모두 풀었습니다. 모임 설정에서 출제 기록을 초기화하면 다시 연습할 수 있어요.');return;}session={queue:questions,records:[],index:0,stage:'question',retry:false,answered:false};questions.forEach(q=>seen.add(q.key));saveLocal('holdem-room-seen-v2',[...seen]);renderPractice();focusQuestion();}
function retrySession(){const qs=shuffle(session.records.filter(r=>r.grade==='risk').map(r=>r.q));if(!qs.length)return;session={queue:qs,records:[],index:0,stage:'question',retry:true,answered:false};renderPractice();focusQuestion();}
function toast(message){document.getElementById('toast')?.remove();const el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),5500);}

function feedbackHtml(record){const {q,action,grade}=record,outs=outCards(q);const drawBlock=q.draw?`<h3>완성에 필요한 카드 · ${outs.length}아웃</h3><p>${q.draw.text}</p><p>다음 턴 한 장: ${outs.length} ÷ 47 = <b>대략 ${pct(drawProbability(outs.length))}</b><br>리버까지 원래 아웃 중 최소 한 장: <b>대략 ${pct(drawProbability(outs.length,47,2))}</b></p><p class="fine">보이는 5장을 제외한 47장이 균등하다고 가정합니다. 두 장 기준은 1 − (47−${outs.length})/47 × (46−${outs.length})/46. 완성 확률은 실제 승률이 아니고, 턴 추가 베팅 없이 리버까지 볼 수 있다는 뜻도 아닙니다.</p>`:`<h3>패가 더 좋아질 수 있나요?</h3><p>${q.mode==='pre'?'공개 카드 전이므로 플랍의 한 장짜리 드로우 아웃을 세지 않습니다. 시작 패의 힘과 자리, 가격을 먼저 봅니다.':q.sourceId==='F18'?'플러시를 만들려면 턴과 리버 모두 해당 무늬여야 합니다. 한 장으로 완성하는 9아웃 드로우와 다르며 백도어 확률은 계산하지 않습니다.':'단일 스트레이트·플러시 드로우가 핵심인 문제가 아닙니다. 개선 카드가 승리를 보장하는 아웃인지는 상대 패 없이 확정할 수 없습니다.'}</p>`;const math=q.call?`필요한 승률 · 콜 가격의 기준<br><b>${money(q,q.call)} ÷ (${money(q,q.pot)} + ${money(q,q.call)})</b><br>= <strong>${pct(requiredEquity(q.pot,q.call))}</strong><br><span class="fine">콜 후 최종 팟 ${money(q,q.pot+q.call)}. 이후 추가 지불 없이 승부가 끝나는 단순 기준입니다. 레이즈 수익성을 계산한 값은 아닙니다.</span>`:`<b>콜 비용 0코인 · 체크는 무료입니다.</b><br>새 베팅이 없어서 콜의 필요 승률 비교를 할 상황이 아닙니다. 이미 낸 앤티를 다시 콜할 필요는 없습니다.`;return `<section class="feedback ${grade}" tabindex="-1" id="feedback"><div class="eyebrow">${ACTIONS[action]} 선택 · ${POINTS[grade]} / 2점</div><h2 class="verdict">${grade==='good'?'✓':grade==='maybe'?'△':'!'} ${LABELS[grade]}</h2><h3>현재 내 패</h3><p>${coinText(q.hand,q)}</p>${drawBlock}<div class="math">${math}</div><p class="fine">상대의 실제 패를 모르는 상태라 정확한 승률은 계산할 수 없음.</p><h3>판단의 이유</h3><p>${coinText(q.reason,q)}</p>${q.actionFeedback[action]?`<p><b>선택한 행동의 조건:</b> ${coinText(q.actionFeedback[action],q)}</p>`:''}<div class="assumption"><b>이번 문제의 평가 기준</b><br>${q.criteria}<br>기준에 가까운 선택: ${ACTIONS[q.best]}${q.alternatives.length?' · 가능한 대안: '+q.alternatives.map(a=>ACTIONS[a]).join(', '):''}</div><div class="feedback-foot"><span class="fine">현재 가정에서의 판단을 평가합니다.</span><button class="primary" data-command="next">${session.index===session.queue.length-1?'결과 보기':'다음 문제'} →</button></div></section>`;}
function resultHtml(){const rs=session.records,total=rs.reduce((a,r)=>a+POINTS[r.grade],0),risks=rs.filter(r=>r.grade==='risk');return `<div class="summary"><div class="eyebrow">SESSION COMPLETE / ${session.retry?'재연습':'연습'} 완료</div><h2 tabindex="-1" id="resultHeading">왜 그 행동을 골랐는지 돌아보세요.</h2><div class="score">${total}<small> / ${session.queue.length*2}점</small></div><p class="home-note">${Object.keys(LABELS).map(g=>`${LABELS[g]} ${rs.filter(r=>r.grade===g).length}`).join(' · ')}</p><div class="categories">${aggregate(rs).map(s=>`<div class="category">${CATEGORIES[s.tag]}<b>${s.count?`${s.score} / ${s.max}점`:'미출제'}</b><span class="fine">${s.count?`${s.count}문제 · ${Math.round(s.score/s.max*100)}%`:'이번 연습에는 해당 문제 없음'}</span></div>`).join('')}</div><p class="fine">한 문제는 여러 영역에 포함될 수 있습니다. 1점은 가능한 대안이며 오답으로 단정하지 않습니다.</p><div class="summary-actions"><button class="primary" data-command="retry" ${risks.length?'':'disabled'}>${risks.length?`위험한 선택 ${risks.length}문제 다시 풀기`:'다시 풀 위험한 선택 없음'}</button><button class="ghost" data-command="lobby">새 연습 고르기</button></div><h3>이번 연습 돌아보기</h3>${rs.map((r,i)=>`<details><summary>${i+1}. ${r.q.title} · ${LABELS[r.grade]}</summary><p>내 선택 ${ACTIONS[r.action]} · 기준 ${ACTIONS[r.q.best]}</p><p>${coinText(r.q.reason,r.q)}</p><p class="fine">${r.q.call?`필요 승률 ${money(r.q,r.q.call)} ÷ ${money(r.q,r.q.pot+r.q.call)} = ${pct(requiredEquity(r.q.pot,r.q.call))}`:'콜 비용 0 · 무료 체크 가능'}</p></details>`).join('')}</div>`;}

const STRATEGY_TABLE="<table><thead><tr><th>자리</th><th>주로 시작하는 패 / 학습 방향</th></tr></thead><tbody><tr><td>UTG / HJ</td><td>77+, AJs+, KQs, AQo+ 중심. HJ의 66·ATs·KJs는 확장 후보. 뒤에 사람이 많아 약한 에이스와 작은 연속패에 신중.</td></tr><tr><td>CO</td><td>55+, ATs+, KJs+, QJs, JTs, AJo+, KQo 중심. 작은 포켓페어와 중간 연속패는 상대에 따라 확장.</td></tr><tr><td>BTN</td><td>22+, A2s+, ATo+, K9s+, Q9s+, J9s+, T9s, 98s, 87s, 76s, KJo+, QJo 등을 시작 후보로 검토. 뒤 두 명의 대응도 중요.</td></tr><tr><td>SB</td><td>항상 먼저 행동해야 하므로 강한 패로 레이즈, 약한 패는 폴드 중심. 림프 전략은 상세하게 가르치지 않음.</td></tr><tr><td>BB / 레이즈 대응</td><td>이미 낸 1BB를 제외한 추가 비용으로 판단. 프리미엄은 재레이즈, 지배당하기 쉬운 패는 폴드. 자리·가격·남은 스택이 맞는 작은 페어/같은 무늬 연속패는 콜도 가능.</td></tr></tbody></table>";
/*
 * Local teaching model, not a poker solver or a model of unknown real opponents.
 * Billings et al., Opponent Modeling in Poker (AAAI 1998), Figures 1–2:
 * https://poker.cs.ualberta.ca/publications/AAAI98.pdf
 * Apply legal-card enumeration, opponent-combination weights and split-pot credit.
 * Da Silva, Approximating Poker Probabilities with Deep Learning (2018), §3.1:
 * https://arxiv.org/pdf/1808.07220
 * Apply fixed hole/board cards and repeated random future-card rollouts only.
 * These educational ranges, equal combination weights, grade conventions and
 * no-further-betting assumption are OUR MODEL, not conclusions of those papers.
 * CFR is a different full-game strategy-learning algorithm; it is not implemented:
 * https://proceedings.neurips.cc/paper/2007/file/08d98638c6fcd194a4b1e6992063e944-Paper.pdf
 * Sampling uncertainty: Hoeffding (1963), bounded independent samples:
 * https://doi.org/10.1080/01621459.1963.10500830
 * Formula verified against UT Austin CS 346 probability notes:
 * https://www.cs.utexas.edu/~dwu4/courses/sp23/static/probability.pdf
 */
(function (root) {
  'use strict';
  const EQ_RANK_TEXT = '23456789TJQKA';
  const EQ_SUIT_TEXT = 'shdc';
  const EQ_BASE = 15 ** 5;
  const EQ_VERSION = 'explicit-flop-model-2';
  const EQ_ALPHA = 0.05 / 3;
  const EQ_CACHE = new Map();
  const EQ_DECK = Array.from({ length: 52 }, (_, i) => i);

  function cardId(card) {
    if (typeof card !== 'string' || !/^[2-9TJQKA][shdc]$/.test(card)) {
      throw new Error('계산할 카드 형식이 잘못되었습니다.');
    }
    return EQ_SUIT_TEXT.indexOf(card[1]) * 13 + EQ_RANK_TEXT.indexOf(card[0]);
  }
  function cardText(id) { return EQ_RANK_TEXT[id % 13] + EQ_SUIT_TEXT[(id / 13) | 0]; }
  function parsedCards(cards, min = 5, max = 7) {
    if (!Array.isArray(cards) || cards.length < min || cards.length > max) {
      throw new Error(`카드 ${min}~${max}장이 필요합니다.`);
    }
    const ids = cards.map(cardId);
    if (new Set(ids).size !== ids.length) throw new Error('같은 카드가 두 번 들어 있습니다.');
    return ids;
  }
  function straightHigh(mask) {
    // Rank bits use 2..14. A2345 is the only low-Ace straight.
    for (let high = 14; high >= 6; high--) {
      const run = 31 << (high - 4);
      if ((mask & run) === run) return high;
    }
    return (mask & ((1 << 14) | 60)) === ((1 << 14) | 60) ? 5 : 0;
  }
  function rankValue(category, kickers) {
    let value = category * EQ_BASE;

function escapeLearningHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const LEARNING_TERM_LOOKUP=new Map();
for(const term of LEARNING_TERMS)for(const name of [term.name,...(term.aliases||[])])LEARNING_TERM_LOOKUP.set(name,term);
const LEARNING_TERM_PATTERN=new RegExp([...LEARNING_TERM_LOOKUP.keys()].sort((a,b)=>b.length-a.length).map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
let learningTipIndex=0;
function annotateTerms(text){
 const source=String(text??'');let out='',offset=0;
 // 긴 용어부터 찾는다. 먼저 HTML로 바꾸지 않고 원래 설명 문자열에서 일치를 찾는다.
 for(const match of source.matchAll(LEARNING_TERM_PATTERN)){
  const term=LEARNING_TERM_LOOKUP.get(match[0]);out+=escapeLearningHtml(source.slice(offset,match.index));
  const tipId='term-tip-'+(++learningTipIndex);
  out+=`<a class="term-link" href="#glossary?term=${encodeURIComponent(term.id)}" data-term="${term.id}" aria-describedby="${tipId}" title="${escapeLearningHtml(term.meaning)} · 누르면 용어 사전">${escapeLearningHtml(match[0])}<span class="term-tip" id="${tipId}" role="tooltip">${escapeLearningHtml(term.meaning)}<small>누르면 예시를 볼 수 있어요.</small></span></a>`;
  offset=match.index+match[0].length;
 }
 return out+escapeLearningHtml(source.slice(offset));
}
function decorateLearningCopy(root){
 // 기존 HTML을 다시 해석하지 않고, 화면의 텍스트 노드만 안전한 링크로 바꾼다.
 // 카드 그림·버튼·이미 있는 링크 안에는 링크를 추가하지 않는다.
 const doc=root?.ownerDocument||document;if(!root||!doc.createTreeWalker||!doc.createElement)return;
 const walker=doc.createTreeWalker(root,4),nodes=[];let node;
 while((node=walker.nextNode())){if(!node.parentElement.closest('a,button,label,[role="img"],.card,svg,script,style')&&[...node.nodeValue.matchAll(LEARNING_TERM_PATTERN)].length)nodes.push(node);}
 for(const textNode of nodes){const template=doc.createElement('template');template.innerHTML=annotateTerms(textNode.nodeValue);textNode.replaceWith(template.content);}
}
function glossaryEntryHtml(term,selected){return `<article class="panel glossary-entry ${selected?'term-highlight':''}" id="term-${term.id}" tabindex="-1"><div class="eyebrow">${escapeLearningHtml(term.aliases?.join(' · ')||'포커 용어')}</div><h2>${term.name}</h2><p class="term-meaning">${term.meaning}</p><div class="term-example"><b>예를 들면</b><p>${term.example}</p></div><div class="term-related"><span>함께 보면 좋아요</span>${term.related.map(name=>{const t=LEARNING_TERM_LOOKUP.get(name);return `<a href="#glossary?term=${t.id}" data-term="${t.id}">${name}</a>`;}).join('')}</div>${term.id==='pot-odds'?'<a class="guide-link" href="#odds">코인 그림으로 계산 배우기 →</a>':''}</article>`;}

function updateOddsCalculator(){
 const potInput=document.getElementById('oddsPot'),callInput=document.getElementById('oddsCall'),output=document.getElementById('oddsCalcOutput');if(!potInput||!callInput||!output)return;
 const rawPot=potInput.value.trim(),rawCall=callInput.value.trim(),pot=Number(rawPot),call=Number(rawCall);
 if(!rawPot||!rawCall||!Number.isSafeInteger(pot)||!Number.isSafeInteger(call)||pot<=0||call<0||call>pot||pot%100||call%100||!Number.isSafeInteger(pot+call)){
  output.innerHTML=call>pot?'<p class="calculator-error">현재 팟에는 상대가 방금 낸 돈도 포함해 주세요. 추가 콜 비용이 그 팟보다 클 수는 없어요.</p>':'<p class="calculator-error">현재 팟은 100코인 이상, 콜 비용은 0코인 이상으로 입력해 주세요. 두 금액 모두 100코인 단위로 입력해요.</p>';potInput.setAttribute('aria-invalid',String(!rawPot||!Number.isSafeInteger(pot)||pot<=0||pot%100!==0));callInput.setAttribute('aria-invalid',String(!rawCall||!Number.isSafeInteger(call)||call<0||call>pot||call%100!==0));return;
 }
 potInput.setAttribute('aria-invalid','false');callInput.setAttribute('aria-invalid','false');
 if(call===0){output.innerHTML='<b>추가 비용 0코인 · 체크는 무료예요.</b><p>맞춰야 할 새 베팅이 없어요. 이미 낸 참가비를 다시 낼 필요는 없어요.</p>';return;}
 // 이미 상대 베팅이 들어 있는 현재 팟에 내 추가 콜 비용만 더한다. 두 번 더하지 않는다.
 const threshold=typeof requiredEquity==='function'?requiredEquity(pot,call):call/(pot+call);
 output.innerHTML=`${call.toLocaleString('ko-KR')} ÷ (${pot.toLocaleString('ko-KR')} + ${call.toLocaleString('ko-KR')}) = <b>${(threshold*100).toFixed(1)}%</b><p>콜 후 팟은 ${(pot+call).toLocaleString('ko-KR')}코인입니다. 추가 베팅 없이 승부가 끝날 때, 평균적으로 가져올 몫이 이 비율 이상이어야 해요.</p>`;
}

// v3: 입문 전략표와 연구 계산의 역할을 분리한다. 논문은 이 사이트의 시작 패 표를 검증하지 않았다.

function fixedGrade(q,action){return action===q.best?'good':q.alternatives.includes(action)?'maybe':'risk';}
function simpleText(text,q){return coinText(text,q).replace(/지배당할 수 있습니다/g,'같은 페어를 만들어도 더 높은 보조 카드에 질 수 있습니다').replace(/지배당할 위험/g,'같은 페어에서 더 높은 보조 카드에 질 위험').replace(/가치를 얻/g,'강한 패로 상대에게 돈을 더 받').replace(/입장할/g,'참가할').replace(/오픈 전략/g,'먼저 베팅하는 전략');}
function explained(text,q){return annotateTerms(simpleText(text,q));}
// 엔진은 수치와 카드 후보를 분리해서 반환한다. UI에는 계산 결과만 평탄화해 전달한다.
async function evaluateFlop(q){const model=await HoldemEquity.evaluateFlop(q);return {...model,ranges:model.ranges.map(r=>({...r,...r.stats}))};}
// 교육적 판정 규칙: 세 가정 모두에서 95% 동시 구간이 본전선을 넘는지 확인한다.
// 이것은 앱의 보수적 설계이며 논문이 정의한 등급이나 실전 GTO 판정이 아니다.
function choiceEvaluation(q,action,model){
 const initial=fixedGrade(q,action);
 if(q.mode==='pre'){
  if(q.call===0&&action==='fold')return {grade:'risk',summary:'지금은 돈을 더 내지 않아도 됩니다. 체크로 계속 볼 수 있어요.',why:'모두 낸 참가비는 이미 팟에 들어간 돈입니다. 새 베팅이 없으니 앤티를 또 내거나, 그 돈이 아까워 무리할 필요가 없습니다.',basis:'무료 체크 규칙'};
  const summary=initial==='good'?'이 입문 기준에서는 무리하지 않은 선택이에요.':initial==='maybe'?'가능한 선택이에요. 다만 상대와 자리 조건을 확인하세요.':'이 입문 기준에서는 부담이 큰 선택이에요.';
  return {grade:initial,summary,why:q.actionFeedback[action]||q.reason,basis:'교육용 시작 패 표 · 논문으로 검증된 실전 정답은 아님'};
 }
 if(action==='raise')return {grade:'maybe',summary:'레이즈는 가능하지만, 상대가 어떻게 반응할지 알아야 평가할 수 있어요.',why:'상대가 폴드하면 바로 팟을 얻고, 콜하거나 다시 올리면 결과가 달라집니다. 이 문제에는 그 반응 확률이 없어서 레이즈가 이익인지 계산하지 않았습니다.',basis:'상대의 레이즈 반응 미지정 · 평가 유보'};
 if(!model||model.error)return {grade:'maybe',summary:'계산 근거가 충분하지 않아 평가를 유보합니다.',why:'실제 상대 카드를 모르며 계산 모델도 확인하지 못했습니다. 한 가지 선택을 정답으로 단정하지 않습니다.',basis:'계산 정보 부족'};
 const positive=model.ranges.every(r=>r.evLow>0),negative=model.ranges.every(r=>r.evHigh<0);
 const numeric=positive?(action==='call'?'good':'risk'):negative?(action==='fold'?'good':'risk'):'maybe';
 const grade=initial===numeric?initial:(initial==='maybe'&&numeric==='good'?'good':'maybe');
 const summary=grade==='good'?(action==='call'?'현재 가격은 콜을 검토할 만해요.':'현재 가격에서는 내려놓는 판단이 좋아요.'):grade==='risk'?(action==='call'?'이 가격을 따라가는 것은 부담이 커요.':'이 가정에서는 계속할 기회를 너무 쉽게 포기해요.'):'상대와 이후 비용에 따라 판단이 달라져요.';
 const why=positive?'설정한 세 상대 가정에서는, 지금 콜하고 이후 돈을 더 내지 않으면 평균적으로 이익인 계산이 나옵니다. 하지만 실제로 턴이나 리버에서 더 내야 한다면 이 계산만으로 콜을 결정할 수 없습니다.':negative?'설정한 세 상대 가정에서는, 끝까지 추가 비용 없이 보더라도 콜의 평균 결과가 손해 쪽입니다. 이미 팟에 넣은 돈이 아까워서 새 돈까지 넣을 필요는 없습니다.':'설정한 상대 가정에 따라 계산이 달라지거나, 표본 오차를 고려하면 본전선에 걸칩니다. 상대가 강한 패로만 베팅하는지, 약한 패로도 베팅하는지 더 알아야 합니다.';
 return {grade,summary,why:why+(grade==='maybe'&&initial!==numeric?' 입문 추천과 계산만으로 확정할 수 없어 평가를 유보했습니다.':''),basis:'입문 추천·허용 대안 + 상대 가정 3개 + 계산 오차 확인'};
}
function modelTableHtml(record){
 const {q,model}=record;if(q.mode==='pre')return `<div class="model-note"><b>프리플랍은 승률 숫자로 채점하지 않습니다.</b><p>뒤에 남은 사람의 카드와 반응, 이후 베팅을 모릅니다. 이 문제는 공개한 입문 기준표로 판단을 연습합니다.</p><a href="#research">기준표와 계산의 차이 보기 →</a></div>`;
 if(!model||model.error)return `<p class="fine">계산 모델을 사용할 수 없어 확정 평가를 하지 않았습니다.</p>`;
 return `<details class="model-details"><summary>계산 근거 열기 · 상대가 달라지면 결과도 달라질까요?</summary><p>아래는 실제 상대의 승률을 알아낸 값이 아닙니다. <b>상대 한 명, 지금 콜하면 턴·리버에서 추가 지불 없이 끝까지 공개</b>한다고 가정한 계산입니다.</p><div class="table-scroll"><table class="equity-table"><caption>상대 카드 후보에 대한 조건부 계산 · 동점은 절반의 몫</caption><thead><tr><th scope="col">상대 가정</th><th scope="col">예상 팟 지분</th><th scope="col">콜의 평균 손익</th></tr></thead><tbody>${model.ranges.map(r=>`<tr><th scope="row">${r.label}<small>${r.count}개 카드 조합</small></th><td>대략 ${pct(r.equity)}<small>계산 구간 ${pct(r.low)}–${pct(r.high)}</small></td><td>${signedCoins(q,r.callEV)}<small>구간 ${signedCoins(q,r.evLow)}–${signedCoins(q,r.evHigh)}</small></td></tr>`).join('')}</tbody></table></div><p class="fine">각 가정 ${model.ranges[0].N.toLocaleString('ko-KR')}회 카드 샘플링. 독립·균등 표본 가정 아래 세 가정 전체에 명목상 95%를 적용한 보수적 표본 오차입니다. 실제 상대 범위가 잘못됐거나 이후 돈을 더 내는 위험은 포함하지 않습니다. 같은 상황은 같은 난수 시드로 계산합니다.</p><details><summary>상대 카드 후보를 어떻게 설정했나요?</summary>${model.ranges.map(r=>`<p><b>${r.label}</b><br>${annotateTerms(r.description)}${r.fallback?'<br><em>'+annotateTerms(r.notes.join(' '))+'</em>':''}</p>`).join('')}<p class="fine">이 세 범위와 블러프 비율은 사이트가 정한 비교 실험입니다. 논문에서 가져온 상대의 실제 행동 빈도가 아닙니다. 가능한 카드는 내 카드와 보드를 제외해 구성합니다.</p></details><a href="#research">논문과 평가 알고리즘 보기 →</a></details>`;
}
function signedCoins(q,amount){const n=Math.round(amount*q.coinUnit);return (n>0?'+':n<0?'−':'')+Math.abs(n).toLocaleString('ko-KR')+'코인';}
function questionHtml(){
 const q=session.queue[session.index],isPre=q.mode==='pre',record=session.records[session.index],viewed=record?.viewedAction||record?.action;
 return `<div class="toolbar"><b>${session.retry?'위험한 선택 재연습':isPre?'A. 시작 패 판단':'B. 공개 카드 이후 판단'}</b><span>문제 ${session.index+1}/${session.queue.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${session.records.filter(r=>!r.pending).length/session.queue.length*100}%"></div></div><div class="question-title"><div class="eyebrow">${q.rule==='house'?'친구 룰 · 블라인드 없음':'표준 홀덤 · 앤티 없음'}</div><h2 tabindex="-1" id="questionHeading">${annotateTerms(q.title)}</h2><p>내 자리 <b>${annotateTerms(positionName(q))}</b> · ${isPre?'공개 카드가 나오기 전입니다.':'공개 카드 3장을 확인하세요.'}</p></div><div class="felt">${seatHtml(q)}${!isPre?`<div class="board-group"><div class="label">공개 카드 3장</div>${cardsHtml(q.board)}</div>`:''}<div class="label">내 카드 2장</div>${cardsHtml(q.hole)}<div class="table-note">${q.rule==='house'?`전원 참가비 ${q.ante.toLocaleString('ko-KR')}코인`:`SB ${money(q,.5)} / BB ${money(q,1)}`} · 시작 스택 ${money(q,100)}</div></div><div class="metrics"><div class="metric"><small>${annotateTerms('현재 팟')} · 상대가 낸 돈 포함</small><strong>${coinNumber(q.pot,q.coinUnit)}<span>코인</span></strong></div><div class="metric"><small>계속하려면 내가 더 낼 돈</small><strong>${coinNumber(q.call,q.coinUnit)}<span>코인</span></strong><small>${q.call===0?'무료로 체크 가능':chipText(Math.round(q.call*q.coinUnit))}</small></div></div><div class="story"><h3>지금까지 일어난 일</h3><ul>${q.history.map(h=>`<li>${explained(h,q)}</li>`).join('')}</ul><details class="quick-guide"><summary>이 문제의 조건 확인</summary><p>${explained(q.assumption,q)}</p><p>추가 베팅이 있을 수 있는 실제 상황입니다. 아래 가격 계산은 추가 베팅이 없는 경우만 비교합니다. 수수료는 제외하며, 계산과 입문 추천이 다르면 평가를 유보합니다.</p></details><p class="term-hint">밑줄 있는 말에 마우스를 올려보세요. 누르면 용어 사전이 열립니다.</p></div>${session.answered?`<div class="compare-note"><b>처음 고른 ${ACTIONS[record.action]}만 점수에 반영됩니다.</b><span>다른 버튼을 누르면 그 선택의 해설을 비교할 수 있어요.</span></div>`:''}<div class="actions" role="group" aria-label="${session.answered?'다른 선택 해설 비교':'내 행동 선택'}">${q.actions.map(a=>`<button class="action ${viewed===a?'selected':''}" data-action="${a}" aria-pressed="${viewed===a}" ${record?.pending?'disabled':''}>${ACTIONS[a]}${record?.action===a?'<span class="first-badge">첫 선택</span>':''}<br><small>${a==='raise'||a==='bet'?`총 ${money(q,q.raiseTo)}`:a==='call'?`추가 ${money(q,q.call)}`:a==='check'?'무료로 계속':'이 판 내려놓기'}</small></button>`).join('')}</div><div id="feedbackSlot" aria-live="polite">${session.answered?feedbackHtml(record):''}</div>`;
}
function feedbackHtml(record){
 const {q}=record,action=record.viewedAction||record.action,comparison=action!==record.action;
 if(record.pending)return `<section class="feedback maybe" id="feedback" tabindex="-1"><h2>선택을 기록했어요.</h2><p>가능한 상대 카드와 턴·리버를 계산 중입니다…</p><span class="fine">계산이 끝나면 총평과 이유를 보여드립니다.</span></section>`;
 const result=choiceEvaluation(q,action,record.model),{grade}=result,outs=outCards(q);
 const drawBlock=q.draw?`<section class="explain-block"><h3>어떤 카드가 더 필요할까요?</h3><p>${explained(q.draw.text,q)}</p><div class="out-summary"><b>${outs.length}장</b><span>다음 한 장으로 이 드로우를 완성하는 후보</span></div><p>내 카드와 공개 카드 5장을 빼면 안 보이는 카드는 47장입니다.<br>${outs.length} ÷ 47 → 다음 카드에서 완성할 확률 <b>대략 ${pct(drawProbability(outs.length))}</b></p><p class="fine">완성해도 상대에게 질 수 있어요. 이 ${outs.length}장이 모두 ‘승리하는 카드’라는 뜻은 아닙니다.</p><details><summary>두 장을 모두 볼 때의 참고 확률</summary><p>기존 후보 카드가 턴·리버 중 한 번이라도 나올 확률은 대략 ${pct(drawProbability(outs.length,47,2))}입니다. 계산: 1 − (47−${outs.length})/47 × (46−${outs.length})/46. 안 보이는 카드가 균등하다는 가정이며, 다음 라운드도 무료라는 뜻은 아닙니다.</p></details></section>`:'';
 const price=q.call?`<div class="price-flow"><div><small>테이블의 돈</small><b>${money(q,q.pot)}</b></div><span>＋</span><div><small>내가 더 낼 돈</small><b>${money(q,q.call)}</b></div><span>＝</span><div><small>콜한 뒤 모이는 돈</small><b>${money(q,q.pot+q.call)}</b></div></div><p><b>${money(q,q.call)} ÷ ${money(q,q.pot+q.call)} = ${pct(requiredEquity(q.pot,q.call))}</b></p><p>추가 비용 없이 끝까지 본다면, 평균적으로 이 팟의 <b>${pct(requiredEquity(q.pot,q.call))} 이상</b>을 가져와야 계산상 본전이에요. 내 패의 승률이 이 숫자라는 뜻은 아닙니다.</p>`:`<p><b>콜 비용 0코인 · 체크는 무료입니다.</b></p><p>누구도 새로 베팅하지 않았으니 지금은 가격을 비교할 필요가 없어요. 이미 낸 참가비를 다시 맞출 필요도 없습니다.</p>`;
 return `<section class="feedback ${grade}" tabindex="-1" id="feedback"><div class="eyebrow">${comparison?'다른 선택 비교 · 점수 변경 없음':'첫 선택의 결과'} / ${ACTIONS[action]}</div><h2 class="verdict">${grade==='good'?'✓':grade==='maybe'?'△':'!'} ${LABELS[grade]}</h2><p class="overall">${explained(result.summary,q)}</p><p class="fine">${comparison?`저장된 첫 선택: ${ACTIONS[record.action]} · ${POINTS[record.grade]} / 2점`:`이 선택 ${POINTS[record.grade]} / 2점`} · ${result.basis}</p><section class="explain-block"><h3>왜 그렇게 보나요?</h3><p>${explained(result.why,q)}</p></section><section class="explain-block"><h3>지금 내 카드는 이런 상태예요.</h3><p>${explained(q.hand,q)}</p></section>${drawBlock}<section class="explain-block"><h3>계속 보는 가격은 얼마일까요?</h3>${price}<a href="#odds">그림으로 콜 가격 이해하기 →</a></section><p class="fine">상대의 실제 패를 모르는 상태라 정확한 승률은 계산할 수 없음.</p>${modelTableHtml(record)}<details class="model-details"><summary>이 문제의 입문 전략 메모</summary><p>${explained(q.reason,q)}</p><p>${explained(q.criteria,q)}</p><p class="fine">교육용 추천: ${ACTIONS[q.best]}${q.alternatives.length?' · 가능한 대안: '+q.alternatives.map(a=>ACTIONS[a]).join(', '):''}. 상대 가정에 따른 계산과 다를 수 있으며, 논문이 이 추천표를 입증한 것은 아닙니다.</p></details><div class="feedback-foot"><span class="fine">다른 선택도 비교해 보세요.</span><button class="primary" data-command="next">${session.review?'결과로 돌아가기':session.index===session.queue.length-1?'결과 보기':'다음 문제'} →</button></div></section>`;

async function answer(action){
 if(!session||session.stage!=='question')return;const active=session,q=active.queue[active.index];if(!q.actions.includes(action))return;
 if(active.answered){const r=active.records[active.index];if(r.pending)return;r.viewedAction=action;renderPractice();document.getElementById('feedback')?.focus({preventScroll:true});return;}
 const r={q,action,viewedAction:action,grade:'maybe',model:null,pending:q.mode==='flop'};active.records.push(r);active.answered=true;renderPractice();document.getElementById('feedback')?.focus({preventScroll:true});
 if(q.mode==='flop'){try{r.model=await evaluateFlop(q);}catch{r.model={error:true};}r.pending=false;}
 r.grade=choiceEvaluation(q,action,r.model).grade;
 if(session===active&&page==='practice'&&!lobby){renderPractice();document.getElementById('feedback')?.focus({preventScroll:true});document.getElementById('feedback')?.scrollIntoView({behavior:'smooth',block:'nearest'});}
}
function nextQuestion(){if(!session?.answered||session.records[session.index]?.pending)return;if(session.review||session.index===session.queue.length-1){session.review=false;session.stage='result';renderPractice();document.getElementById('resultHeading')?.focus({preventScroll:true});document.getElementById('app')?.scrollIntoView({behavior:'smooth',block:'start'});}else{session.index++;session.answered=false;renderPractice();focusQuestion();}}
function updateNote(){const note=document.getElementById('sessionNote');if(!note)return;const done=session?.records.filter(r=>!r.pending)||[];note.innerHTML=session?`<div class="rounds" aria-label="응답 기록">${session.queue.map((q,i)=>{const r=session.records[i];return `<span class="dot ${r&&!r.pending?r.grade:''}" title="문제 ${i+1}${r&&!r.pending?' · '+LABELS[r.grade]:''}">${r?.pending?'…':r?(r.grade==='good'?'✓':r.grade==='maybe'?'△':'!'):i+1}</span>`;}).join('')}</div><div class="legend">✓ 좋은 선택 &nbsp; △ 상황에 따라 &nbsp; ! 위험</div><p class="fine">${done.length} / ${session.queue.length} 응답 · ${done.reduce((a,r)=>a+POINTS[r.grade],0)}점<br>처음 선택만 기록합니다.</p>`:'<p class="fine">모드를 고르고 시작하세요.<br>모르는 말은 밑줄을 눌러 찾아보세요.</p>';}
function resultHtml(){const rs=session.records,total=rs.reduce((a,r)=>a+POINTS[r.grade],0),risks=rs.filter(r=>r.grade==='risk');return `<div class="summary"><div class="eyebrow">10문제 연습 / ${session.retry?'재연습':'연습'} 완료</div><h2 tabindex="-1" id="resultHeading">선택보다, 이유를 기억하세요.</h2><div class="score">${total}<small> / ${session.queue.length*2}점</small></div><p class="home-note">${Object.keys(LABELS).map(g=>`${LABELS[g]} ${rs.filter(r=>r.grade===g).length}`).join(' · ')}</p><p class="fine">처음 고른 행동으로만 집계했습니다. 1점은 판단에 필요한 정보가 더 있거나 가능한 대안입니다.</p><div class="categories">${aggregate(rs).map(s=>`<div class="category">${CATEGORIES[s.tag]}<b>${s.count?`${s.score} / ${s.max}점`:'미출제'}</b><span class="fine">${s.count?`${s.count}문제`:'이번 연습에는 해당 문제 없음'}</span></div>`).join('')}</div><p class="fine">한 문제는 여러 영역에 포함될 수 있습니다. 입문 표와 조건부 가격 모델의 연습 점수이며 실전 실력이나 수익을 측정하지 않습니다.</p><div class="summary-actions"><button class="primary" data-command="retry" ${risks.length?'':'disabled'}>${risks.length?`위험한 선택 ${risks.length}문제 다시 풀기`:'다시 풀 위험한 선택 없음'}</button><button class="ghost" data-command="lobby">새 연습 고르기</button></div><h3>다른 선택까지 돌아보기</h3>${rs.map((r,i)=>`<details><summary>${i+1}. ${r.q.title} · ${LABELS[r.grade]}</summary><p>첫 선택 ${ACTIONS[r.action]} · ${explained(choiceEvaluation(r.q,r.action,r.model).summary,r.q)}</p><button class="ghost" data-review="${i}">이 문제의 다른 선택 비교</button></details>`).join('')}</div>`;}
const PAPER_LINKS={billings:'https://poker.cs.ualberta.ca/publications/AAAI98.pdf',silva:'https://arxiv.org/pdf/1808.07220',cfr:'https://proceedings.neurips.cc/paper/2007/file/08d98638c6fcd194a4b1e6992063e944-Paper.pdf'};
function renderResearch(){view.innerHTML=pageHead('평가를 확인해 보세요','무슨 근거로 평가하나요?','계산 가능한 부분은 계산하고, 상대에 대한 정보가 부족하면 판단을 유보합니다.')+`<div class="research-intro"><b>논문을 참고해 계산을 만들었어요.</b><p>논문이 우리 문제 145개의 추천 행동을 검증한 것은 아닙니다. 모든 상황을 푸는 솔버를 구현한 것도 아닙니다. 시작 패 표의 추천과, 플랍의 조건부 가격 계산을 구분해서 보여드립니다.</p></div><div class="tip-grid"><section class="panel"><h2>1. 시작 패 문제</h2><p>자리·패·앞선 행동을 담은 입문 기준표로 평가합니다. 무료 체크와 참가비의 차이도 확인합니다.</p><p class="fine">프리플랍의 실전 수익성은 뒤 사람의 반응과 이후 베팅까지 필요하므로 승률 하나로 증명하지 않습니다.</p></section><section class="panel"><h2>2. 플랍의 콜·폴드</h2><p>서로 다른 상대 카드 후보 3개를 설정하고, 턴·리버를 각각 4,000번 샘플링합니다. 동점이면 팟의 절반을 내 몫으로 셉니다.</p><p class="fine">현재 콜 후 추가 베팅 없이 끝까지 보는 경우의 평균 손익만 계산합니다.</p></section><section class="panel"><h2>3. 결론이 바뀌면 유보</h2><p>상대 가정이나 계산 오차에 따라 콜이 이익·손해를 오가면 ‘상황에 따라 가능’입니다. 입문 표와 계산이 다를 때도 유보합니다.</p><p class="fine">레이즈에 대한 상대의 폴드·콜·재레이즈 반응은 지정하지 않았으므로 레이즈 평가도 유보합니다.</p></section></div><section class="panel research-method"><h2>숫자는 이렇게 계산합니다.</h2><p>안 보이는 상대 카드 후보를 고르고, 남은 덱에서 서로 다른 턴·리버를 뽑습니다. 내 카드와 상대 카드 각각에서 가장 좋은 5장을 비교합니다.</p><div class="math">예상 팟 지분 = (승리 횟수 + 동점 횟수 ÷ 2) ÷ 반복 횟수<br>콜 평균 손익 = 예상 팟 지분 × (현재 팟 + 콜 비용) − 콜 비용<br>폴드의 지금부터의 추가 손익 = 0</div><p>이미 낸 돈은 돌아오지 않는 비용입니다. 그래서 지금 선택을 비교할 때는 새로 낼 돈만 셉니다.</p><details><summary>등급과 오차의 세부 기준</summary><p>세 가정의 계산 구간이 모두 본전선보다 높거나 낮은 경우만 한 방향의 결론으로 봅니다. 계산상 유리한 선택이 입문 표에서도 추천 또는 허용된 경우 좋은 선택으로 봅니다. 표가 위험하다고 본 행동을 계산도 불리하다고 볼 때 위험한 선택을 유지합니다. 나머지는 유보합니다. 이 규칙은 사이트의 교육 설계이며 논문의 등급 규칙이 아닙니다.</p><p>각 표본의 팟 몫은 0·0.5·1입니다. 표본 오차 ε = √(ln(2/α)/(2N)), N=4,000, α=0.05/3을 사용합니다. 독립 표본을 가정한 Hoeffding bound와 세 비교의 합집합 상한으로 명목상 동시 95% 구간을 잡습니다. 의사난수는 고정 시드이며 상대 범위의 오류·실제 전략 차이는 이 구간이 설명하지 않습니다. 오차 공식 참고: <a href="https://www.cs.utexas.edu/~dwu4/courses/sp23/static/probability.pdf" target="_blank" rel="noopener noreferrer">UT Austin 확률 강의 노트 ↗</a>.</p><p>상대 가정은 ‘강한 패 중심’, ‘페어·드로우 혼합’, ‘혼합 75% + 아무것도 없는 패 25%’입니다. 각 그룹 안의 가능한 카드 조합은 같은 비중입니다. 보드에 페어가 있어 약한 패 그룹이 비면 혼합 그룹만 쓰고 그 사실을 표시합니다. 이 비중은 실험용 설정이며 상대를 관찰해 추정한 빈도가 아닙니다.</p></details><a href="#odds">먼저 콜 가격을 그림으로 이해하기 →</a></section><section class="link-grid research-papers"><a class="panel resource" href="${PAPER_LINKS.billings}" target="_blank" rel="noopener noreferrer"><span class="language">원논문 · AAAI 1998 · 영문 PDF</span><h2>Opponent Modeling in Poker ↗</h2><p>Billings 외. 가능한 상대 패를 비교하고, 동점 몫과 상대별 카드 가중치를 고려하는 방법을 참고했습니다.</p></a><a class="panel resource" href="${PAPER_LINKS.silva}" target="_blank" rel="noopener noreferrer"><span class="language">연구 원문 · arXiv 2018 · 영문 PDF</span><h2>Approximating Poker Probabilities with Deep Learning ↗</h2><p>Da Silva. 카드 고정 후 반복 샘플링하는 몬테카를로 절차를 참고했습니다. 논문의 신경망은 사용하지 않습니다.</p></a><a class="panel resource" href="${PAPER_LINKS.cfr}" target="_blank" rel="noopener noreferrer"><span class="language">원논문 · NIPS 2007 · 영문 PDF</span><h2>Regret Minimization in Games with Incomplete Information ↗</h2><p>Zinkevich 외. 전체 게임의 전략 학습인 CFR과 우리 가격 계산의 차이를 확인했습니다. CFR·GTO를 구현했다는 뜻은 아닙니다.</p></a></section><section class="panel research-method"><details><summary>입문 시작 패 표 보기 · 표준 홀덤 기준</summary><p>s는 같은 무늬, o는 다른 무늬, +는 더 높은 숫자 조합입니다. 친구 룰에서 새 베팅이 없으면 약한 패도 무료 체크로 계속 볼 수 있습니다.</p><div class="table-scroll" id="strategyTable"></div><p class="fine">상대 범위와 뒤 사람의 반응이 미지정인 보수적 입문 예시입니다. 수익 보장표가 아닙니다.</p></details></section>`;document.getElementById('strategyTable').innerHTML=STRATEGY_TABLE;}
function sidebarHtml(){return `<aside class="sidebar"><section class="panel panel-pad"><h2>연습 기록</h2><p>좋은 선택 2점 · 유보 1점 · 위험 0점</p><div id="sessionNote"></div></section><section class="panel panel-pad"><h2>헷갈리면 펼쳐보세요.</h2><div class="reference-links"><a href="#hands">♠ 그림으로 보는 족보</a><a href="#glossary">? 용어 사전</a><a href="#odds">◉ 콜 가격 그림 설명</a><a href="#research">⌕ 평가 알고리즘·논문</a></div><p class="fine">다른 페이지를 봐도 연습은 유지됩니다.</p></section></aside>`;}
function renderPractice(){view.innerHTML=pageHead('직접 골라보세요 / 한 번에 10문제','이 상황에서는 어떻게 할까요?','행동을 고르면 총평부터 보여드립니다. 그다음 다른 행동도 눌러 비교할 수 있어요.')+`<div class="practice-nav"><a href="#basics">처음이라면 그림 안내</a><a href="#hands">족보표</a><a href="#odds">콜 가격 설명</a>${session&&!lobby?'<button class="guide-link" data-command="lobby">연습 설정 보기</button>':''}</div><div class="layout"><section class="panel" id="app" aria-label="연습 문제">${lobby||!session?practiceLobby():session.stage==='result'?resultHtml():questionHtml()}</section>${sidebarHtml()}</div>`;updateNote();}
function navigate(){const [route,query='']=location.hash.slice(1).split('?');page=['home','hands','learn','practice','friends','basics','odds','glossary','research'].includes(route)?route:'home';document.querySelectorAll('.nav a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+page?'page':'false'));document.getElementById('guideWrap').hidden=page!=='practice';const pages={home:renderHome,hands:renderHands,learn:renderLearn,practice:renderPractice,friends:renderFriends,basics:renderBasics,odds:renderOdds,research:renderResearch};if(page==='glossary')renderGlossary(new URLSearchParams(query).get('term')||'');else pages[page]();if(page==='odds')updateOddsCalculator();document.getElementById('pageHeading')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});if(page==='glossary')focusGlossaryTerm(new URLSearchParams(query).get('term')||'');}
function focusGlossaryTerm(term){const selected=LEARNING_TERMS.find(t=>t.id===term||t.name===term);if(!selected)return;const entry=document.getElementById('term-'+selected.id);entry?.focus({preventScroll:true});entry?.scrollIntoView({behavior:'smooth',block:'center'});}
view.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.review){const index=Number(b.dataset.review);if(!Number.isInteger(index)||!session?.records[index])return;session.index=index;session.stage='question';session.answered=true;session.review=true;lobby=false;renderPractice();focusQuestion();}});
view.addEventListener('input',e=>{if(page==='odds'&&e.target.matches?.('[data-odds]'))updateOddsCalculator();if(page==='glossary'&&e.target.matches?.('[data-glossary-search]'))filterGlossaryEntries(e.target.value);});
view.addEventListener('change',e=>{if(page==='odds'&&e.target.matches?.('[data-odds]'))updateOddsCalculator();});

validateQuestions(SEEDS);navigate();</script></body></html>
